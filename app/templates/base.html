<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SDS Generator{% endblock %}</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark bg-navy px-4">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-file-earmark-medical-fill me-2"></i>SDS Generator
    </a>
    <span class="text-light small">GHS / OSHA HazCom 2012 &amp; WHMIS 2015</span>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-muted small py-3 border-top">
    Chemical data sourced from
    <a href="https://pubchem.ncbi.nlm.nih.gov" target="_blank">PubChem (NLM/NIH)</a>.
    Generated SDS documents must be reviewed by a qualified safety professional before use.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
